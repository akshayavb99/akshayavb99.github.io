- title: "LLMs-as-Judges: A Comprehensive Survey on LLM-based Evaluation Methods"
  type: research paper
  author:
    - Haitao Li
    - Qian Dong
    - Junjie Chen
    - Huixue Su
    - Yujia Zhou
    - Qingyao Ai
    - Ziyi Ye
    - Yiqun Liu
  date: 2026-07-04
  description: >
    Presents a comprehensive survey of the LLMs-as-judges paradigm, providing
    a systematic framework to understand how large language models are used as
    automated evaluators. The authors break down the field across five distinct
    perspectives: Functionality (why use them), Methodology (how to construct
    evaluation systems), Applications (where they are deployed), Meta-evaluation
    (how to test the judges themselves), and Limitations. The paper tracks 
    current methodologies, implementation constraints like position and 
    model bias, and maps out future directions for scalable AI evaluation.
  paper_url: https://arxiv.org/abs/2412.05579
  notes_url:
  tags:
    - large-language-models
    - llm-as-a-judge
    - evaluation-frameworks
    - survey
    - benchmark
    - meta-evaluation
    - model-bias
- title: "Stress-Testing Model Specs Reveals Character Differences among Language Models"
  type: research paper
  author:
    - Jifan Zhang
    - Henry Sleight
    - Andi Peng
    - John Schulman
    - Esin Durmus
  date: 2026-05-29
  description: >
    Proposes a systematic methodology for stress-testing AI constitutions
    and model specifications by generating value tradeoff scenarios where
    competing principles cannot be simultaneously satisfied. Evaluating
    twelve frontier language models across more than 300,000 scenarios,
    the authors identify over 70,000 cases of significant behavioral
    divergence. High disagreement between models strongly predicts
    contradictions and ambiguities in model specifications, revealing how
    differences in behavioral guidelines contribute to distinct model
    "character" and value prioritization patterns.
  paper_url: https://arxiv.org/abs/2510.07686
  notes_url: https://akshayavb99.github.io/learning-notes/paper-summaries/stress-testing-model-specs-reveals-character-diff-among-LMs/
  tags:
    - large-language-models
    - ai-alignment
    - model-specifications
    - constitutional-ai
    - ai-safety
    - evaluation
    - behavioral-analysis
    - value-alignment
